name: Update codes & deploy

on:
  schedule:
    - cron: '17 */3 * * *' # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest codes
        run: node scripts/update.mjs

      - name: Save data
        run: |
          git config user.name "codes-bot"
          git config user.email "codes-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Update codes $(date -u +%F' '%H:%M)" && git push)

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
